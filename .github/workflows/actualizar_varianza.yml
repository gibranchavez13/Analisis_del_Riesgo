name: Estimar varianza diaria

on:
  schedule:
    - cron: "17 23 * * 1-5"   # lunes a viernes, 23:17 UTC = 17:17 hora de Ciudad de México
    - cron: "17 1 * * 2-6"    # segundo intento: 01:17 UTC (martes a sábado) = 19:17 de lunes a viernes en Ciudad de México
  workflow_dispatch:           # permite ejecutarlo a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  estimar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::quantmod
            any::openxlsx
            any::rugarch

      # Cada modelo corre aunque falle el anterior; si alguno falla, la corrida termina en rojo
      - name: Ejecutar estimación (promedio móvil)
        run: Rscript estimar_varianza.R

      - name: Ejecutar estimación EWMA
        if: success() || failure()
        run: Rscript estimar_ewma.R

      - name: Ejecutar estimación DDEWMA
        if: success() || failure()
        run: Rscript estimar_ddewma.R

      - name: Ejecutar estimación GARCH
        if: success() || failure()
        run: Rscript estimar_garch.R

      - name: Commit y push
        if: success() || failure()   # guarda los Excel que sí se actualizaron aunque un modelo falle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- '*.xlsx'          # todos los Excel; no falla si alguno aún no existe
          FECHA=$(Rscript -e 'cat(max(openxlsx::read.xlsx("varianza_estimada.xlsx")$fecha))')
          git diff --cached --quiet || git commit -m "Estimación para el $FECHA"
          git push
