name: Pronóstico GARCH octubre

on:
  workflow_dispatch:           # solo se ejecuta a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  pronosticar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::quantmod
            any::openxlsx
            any::rugarch

      - name: Pronosticar del 5 al 30 de octubre
        run: Rscript pronostico_garch_octubre.R

      - name: Commit y push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pronostico_garch_octubre.xlsx
          git diff --cached --quiet || git commit -m "Pronóstico GARCH(1,1) del 5 al 30 de octubre de 2026"
          git pull --rebase
          git push
